<div class="auth-body">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="material-icons logo-icon">account_balance_wallet</span>
      <h1>MyMoney</h1>
      <p class="auth-subtitle">Create your account</p>
    </div>

    <div class="alert alert-error" ng-if="error">{{ error }}</div>

    <form ng-submit="signup()" novalidate>
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">person</span>
          <input type="text" ng-model="formData.name" placeholder="John Doe" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">email</span>
          <input type="email" ng-model="formData.email" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Currency</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">currency_exchange</span>
          <select ng-model="formData.currency">
            <option value="₹">₹ Indian Rupee</option>
            <option value="$">$ US Dollar</option>
            <option value="€">€ Euro</option>
            <option value="£">£ British Pound</option>
            <option value="¥">¥ Japanese Yen</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">lock</span>
          <input type="password" ng-model="formData.password" placeholder="Min. 6 characters" required>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">lock_outline</span>
          <input type="password" ng-model="formData.confirm_password" placeholder="Repeat password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
        <span ng-if="!loading">Create Account</span>
        <span ng-if="loading">Creating...</span>
      </button>
    </form>

    <p class="auth-link">Already have an account? <a ui-sref="login">Login</a></p>
  </div>
</div>
