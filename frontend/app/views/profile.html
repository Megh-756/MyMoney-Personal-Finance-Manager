<div class="page-content">
  <div class="form-page-header">
    <a ui-sref="app.dashboard" class="back-btn"><span class="material-icons">arrow_back</span></a>
    <h1>Profile & Settings</h1>
  </div>

  <div class="form-card">
    <div class="alert alert-success" ng-if="success">{{ success }}</div>
    <div class="alert alert-error" ng-if="error">{{ error }}</div>

    <form ng-submit="save()" novalidate>
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">person</span>
          <input type="text" ng-model="formData.name" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">email</span>
          <input type="email" ng-model="formData.email" disabled style="opacity:0.6;">
        </div>
      </div>

      <div class="form-group">
        <label>Country</label>
        <select ng-model="formData.country">
          <option value="">-- Select Country --</option>
          <option ng-repeat="c in countries" value="{{ c }}">{{ c }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Currency Symbol</label>
        <select ng-model="formData.currency">
          <option ng-repeat="c in currencies" value="{{ c }}">{{ c }}</option>
        </select>
      </div>

      <div class="divider"></div>
      <p class="section-subtitle">Change Password (leave blank to keep current)</p>

      <div class="form-group">
        <label>New Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">lock</span>
          <input type="password" ng-model="formData.new_password" placeholder="New password">
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">lock_outline</span>
          <input type="password" ng-model="formData.confirm_password" placeholder="Confirm new password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
        <span ng-if="!loading">Save Changes</span>
        <span ng-if="loading">Saving...</span>
      </button>
    </form>
  </div>
</div>
