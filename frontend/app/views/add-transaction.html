<div class="page-content">
  <div class="form-page-header">
    <a ui-sref="app.transactions" class="back-btn"><span class="material-icons">arrow_back</span></a>
    <h1>{{ isEdit ? 'Edit Transaction' : 'New Transaction' }}</h1>
  </div>

  <div class="form-card">
    <div class="alert alert-error" ng-if="error">{{ error }}</div>

    <form ng-submit="save()" novalidate>

      <!-- Type Selector -->
      <div class="type-selector">
        <button type="button" class="type-btn expense-btn" ng-class="{active: formData.type==='expense'}" ng-click="formData.type='expense'; onTypeChange()">
          <span class="material-icons">trending_down</span> Expense
        </button>
        <button type="button" class="type-btn income-btn" ng-class="{active: formData.type==='income'}" ng-click="formData.type='income'; onTypeChange()">
          <span class="material-icons">trending_up</span> Income
        </button>
        <button type="button" class="type-btn transfer-btn" ng-class="{active: formData.type==='transfer'}" ng-click="formData.type='transfer'; onTypeChange()">
          <span class="material-icons">swap_horiz</span> Transfer
        </button>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label>Amount ({{ currency }})</label>
        <input type="number" ng-model="formData.amount" placeholder="0.00" step="0.01" min="0.01" required>
      </div>

      <!-- Account -->
      <div class="form-group">
        <label>{{ formData.type === 'transfer' ? 'From Account' : 'Account' }}</label>
        <select ng-model="formData.account" required>
          <option value="">-- Select Account --</option>
          <option ng-repeat="acc in accounts" value="{{ acc._id }}">{{ acc.name }} ({{ currency }} {{ acc.balance | number:2 }})</option>
        </select>
      </div>

      <!-- Transfer To Account -->
      <div class="form-group" ng-if="formData.type==='transfer'">
        <label>To Account</label>
        <select ng-model="formData.transfer_to_account" required>
          <option value="">-- Select Account --</option>
          <option ng-repeat="acc in accounts" value="{{ acc._id }}" ng-if="acc._id !== formData.account">{{ acc.name }}</option>
        </select>
      </div>

      <!-- Category (for income/expense only) -->
      <div class="form-group" ng-if="formData.type!=='transfer'">
        <label>Category</label>
        <select ng-model="formData.category">
          <option value="">-- Select Category --</option>
          <option ng-repeat="cat in filteredCategories" value="{{ cat._id }}">{{ cat.name }}</option>
        </select>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label>Date</label>
        <input type="date" ng-model="formData.date" required>
      </div>

      <!-- Remarks -->
      <div class="form-group">
        <label>Remarks (optional)</label>
        <input type="text" ng-model="formData.remarks" placeholder="Add a note...">
      </div>

      <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
        <span ng-if="!loading">{{ isEdit ? 'Update Transaction' : 'Save Transaction' }}</span>
        <span ng-if="loading">Saving...</span>
      </button>
      <a ui-sref="app.transactions" class="btn btn-secondary btn-block" style="margin-top:10px;">Cancel</a>
    </form>
  </div>
</div>
