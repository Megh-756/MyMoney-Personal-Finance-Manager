<div class="auth-body">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="material-icons logo-icon">account_balance_wallet</span>
      <h1>MyMoney</h1>
      <p class="auth-subtitle">Take control of your finances</p>
    </div>

    <div class="alert alert-error" ng-if="error">{{ error }}</div>

    <form ng-submit="login()" novalidate>
      <div class="form-group">
        <label>Email</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">email</span>
          <input type="email" ng-model="formData.email" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrap">
          <span class="material-icons input-icon">lock</span>
          <input type="password" ng-model="formData.password" placeholder="Your password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
        <span ng-if="!loading">Login</span>
        <span ng-if="loading">Logging in...</span>
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a ui-sref="signup">Sign Up</a></p>
  </div>
</div>
